[phases.build]
nixPkgs = ["nodejs-18_x", "npm-9_x"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npx prisma generate", 
  "npm run build", 
  "cd backend && npm install && npm run build",
  # Create essential exercise GIF directories for Railway deployment
  "mkdir -p public/exercise-gifs/warmup",
  "mkdir -p public/exercise-gifs/strength",
  "mkdir -p public/exercise-gifs/cardio",
  "mkdir -p public/exercise-gifs/flexibility",
  # Create README files for empty directories (prevents git issues)
  "echo '# Warmup Exercise GIFs - Created during deployment' > public/exercise-gifs/warmup/.gitkeep",
  "echo '# Directory structure created for exercise GIF organization' > public/exercise-gifs/.deployed"
]

[start]
cmd = "npm run start:production"

[variables]
NODE_ENV = "production"
PORT = "3001"